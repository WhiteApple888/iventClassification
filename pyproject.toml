[project]
name = "iventclassification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WeiQin", email = "tanweiqin1995@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
iventclassification = "iventclassification:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
